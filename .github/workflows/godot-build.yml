name: Build Godot Web & Node Server

# mainブランチにプッシュされた時（または手動）に実行
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Godot Webエクスポートの実行
        # Godot 4.x用のビルドアクション（バージョンはプロジェクトに合わせて変更してください）
        uses: firebelley/godot-export@v5
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./ # project.godotがあるディレクトリ
          archive_output: false
          export_debug: false
          use_preset_export_path: true

      - name: クライアントとサーバーファイルの統合
        run: |
          # デプロイ用のフォルダを作成
          mkdir -p release
          
          # Godotのビルドファイル（index.html, .wasm, .pckなど）をコピー
          # ※コピー元のパスは export_presets.cfg で指定した出力先に合わせてください
          cp -r build/Web/* release/
          
          # サーバー関連のファイルをコピー
          cp server.js release/
          cp package.json release/
          
          # 依存関係が必要な場合はここでインストール（任意）
          # cd release && npm install --production

      - name: ビルド結果の保存 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-server
          path: release/
