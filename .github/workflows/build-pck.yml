name: Generate Godot PCK

on:
  push:
    branches:
      - main

jobs:
  export-pck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Godot & Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Export Web Build and Extract PCK
        run: |
          mkdir -p build_output
          mkdir -p final_pck
          
          # 一度通常のWebエクスポート（index.htmlやpckを含む一式）として出力する
          PROJECT_PATH="$(pwd)"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$PROJECT_PATH" --export-release "Web" "$PROJECT_PATH/build_output/index.html"
          
          # 出力された中から .pck ファイルだけを回収してリネームする
          find build_output -name "*.pck" -exec cp {} final_pck/game.pck \;

      - name: Upload PCK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityroom-pck-file
          path: final_pck/game.pck
