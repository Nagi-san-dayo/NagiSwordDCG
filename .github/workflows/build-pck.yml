name: Build Unityroom ZIP

on:
  push:
    branches:
      - main

jobs:
  build-web-game:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GodotPckToolのダウンロード
        run: |
          wget https://github.com/hhyyrylainen/GodotPckTool/releases/latest/download/godotpcktool
          chmod +x godotpcktool

      - name: 1. index.pck の作成
        run: |
          mkdir build_target
          rsync -av --exclude='.git' --exclude='.github' --exclude='godotpcktool' --exclude='build_target' ./ build_target/
          cd build_target
          ../godotpcktool ../index.pck -a a *
          cd ..

      - name: 2. Godot Web用エンジンのダウンロード (例: v1.7.1)
        run: |
          # 公式からWeb用のエクスポートテンプレートをダウンロード
          wget https://downloads.tuxfamily.org/godotengine/4.7.1/Godot_v4.7.1-stable_export_templates.tpz
          # tpzは実質zipなので解凍する
          unzip Godot_v4.7.1-stable_export_templates.tpz
          
      - name: 3. Unityroom用ファイルの組み立て
        run: |
          mkdir unityroom_upload
          
          # 自分のPCKを配置
          mv index.pck unityroom_upload/
          
          # 自分のindex.htmlを配置 (リポジトリにある独自のものを使用)
          # ※もしリポジトリのhtmlを使わず、Godot公式のhtmlを使いたい場合は下2行はコメントアウトし、
          # mv templates/webassembly_release.html unityroom_upload/index.html を使います
          mv index.html unityroom_upload/
          
          # Godotのエンジン本体(wasm, js)をリネームして配置
          mv templates/webassembly_release.wasm unityroom_upload/index.wasm
          mv templates/webassembly_release.js unityroom_upload/index.js
          
          # Unityroom用にZIPに固める
          cd unityroom_upload
          zip -r ../unityroom_game.zip *

      - name: 成果物(Unityroom用ZIP)をダウンロード
        uses: actions/upload-artifact@v4
        with:
          name: unityroom-upload-file
          path: unityroom_game.zip