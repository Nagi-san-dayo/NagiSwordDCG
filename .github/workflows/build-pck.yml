name: Godot Web Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Godot HTML5
        uses: firebelley/godot-export@v4.7.1
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.1/Godot_v4.7.1-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.1/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          export_debug: false
          use_preset_export_path: false
          export_preset_name: "HTML5" # export_presets.cfgに設定した名前

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build # ビルドされたファイル（.html, .wasm, .pckなど）が出力されるディレクトリ
