name: Auto Build PCK (No Godot Binary)

on:
  push:
    paths:
      - 'index.html'
      - 'server.js'

jobs:
  build-pck-tool:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: PCKパッキングツールの取得（例: godot-pck-tool）
        run: |
          git clone https://github.com/hhyyry/godot-pck-tool.git
          pip install -r godot-pck-tool/requirements.txt

      - name: 指定ファイルをPCKにパッキング
        run: |
          # ツールを使用して index.html と server.js だけをPCK化するコマンド例
          python godot-pck-tool/pck.py pack update_data.pck index.html server.js

      - name: 成果物(PCK)をGitHubに保存
        uses: actions/upload-artifact@v4
        with:
          name: mod-pck-file
          path: update_data.pck
