name: Build for unityroom

on:
  push:
    branches:
      - main # ※ブランチ名が master の場合は master に書き換えてください

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Godotのセットアップ
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1 # ※実際のGodotのバージョンに合わせてください
          use-dotnet: false
          include-templates: true

      - name: Web(HTML5)用エクスポート
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: カスタムファイルの結合
        run: |
          cp index.html build/web/index.html

      - name: unityroom用のZIPファイルを作成
        run: |
          cd build/web
          zip -r ../unityroom_game.zip *

      - name: ZIPファイルをGitHubに保存（ダウンロード用）
        uses: actions/upload-artifact@v4
        with:
          name: unityroom-zip
          path: build/unityroom_game.zip
