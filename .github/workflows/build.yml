name: Zip for unityroom

on:
  push:
    branches:
      - main # ※ブランチ名が master の場合は master に書き換えてください

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: unityroom用のZIPファイルを作成
        run: |
          # リポジトリ内のすべてのファイルをZIP化します
          # （※GitHub用の管理ファイルや、unityroomで動かない server.js は除外します）
          zip -r unityroom_game.zip . -x "*.git*" -x ".github/*" -x "server.js"

      - name: ZIPファイルをGitHubに保存（ダウンロード用）
        uses: actions/upload-artifact@v4
        with:
          name: unityroom-zip
          path: unityroom_game.zip
