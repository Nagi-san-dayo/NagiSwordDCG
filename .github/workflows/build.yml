name: Build PCK Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.jsのセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # 3. 指定したファイルをまとめる処理
      - name: Create index.pck
        run: |
          tar -cvf index.pck index.html server.js package.json image/

      # 4. 生成した index.pck を成果物として保存する
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pck
          path: index.pck
